<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="桑多涅">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22303f"/>
      <stop offset="1" stop-color="#0e141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4df9b"/>
      <stop offset="1" stop-color="#b5862f"/>
    </linearGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ece6"/>
      <stop offset="1" stop-color="#cdbfb6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 提线木偶的横杆 -->
  <rect x="18.5" y="8" width="27" height="3.4" rx="1.7" fill="url(#gold)"/>
  <rect x="31" y="5.2" width="2" height="9" rx="1" fill="url(#gold)"/>

  <!-- 四根吊线 -->
  <path d="M24 11.6 L24 23.5 M40 11.6 L40 23.5 M29.5 11.6 L29.5 21.5 M34.5 11.6 L34.5 21.5"
        stroke="#c9b478" stroke-width="1" opacity="0.7"/>

  <!-- 瓷偶的脸 -->
  <circle cx="30.5" cy="32" r="9.6" fill="url(#porcelain)" stroke="url(#gold)" stroke-width="1.6"/>
  <path d="M25.4 30.2 L28.8 31.9" stroke="#b4525f" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M35.6 30.2 L32.2 31.9" stroke="#b4525f" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M28.2 36.6 Q30.5 37.9 32.9 36.6" stroke="#8d6a63" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M21.6 26.2 Q30.5 21.6 39.4 26.2" stroke="#2a3542" stroke-width="2.3" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- 发条钥匙：柄插进后颈，右边露出环 -->
  <g>
    <path d="M38.4 39.6 L43.6 44.8" stroke="url(#gold)" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="46.2" cy="47.4" r="5.2" fill="#16202b" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="46.2" cy="47.4" r="1.5" fill="#8fe3d2"/>
  </g>
</svg>
